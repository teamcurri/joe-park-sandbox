<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Curri landing page prototypes</title>
<meta name="description" content="Prototype landing pages for Curri industry verticals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/curri.css?v=5">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .hub {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  .hub .logo {
    height: 22px;
    margin-bottom: 36px;
  }

  .hub ul {
    list-style: none;
    margin: 28px 0 0;
    padding: 0;
    border-top: 1px solid var(--hairline);
  }

  .hub li {
    border-bottom: 1px solid var(--hairline);
  }

  .hub a.page-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 2px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 17px;
  }

  .hub a.page-link:hover {
    color: var(--text-body);
  }
</style>
</head>
<body>
<main class="hub">
  <img src="./assets/curri-logo-black.svg" alt="Curri" class="logo" />
  <h1 class="h-section">Landing page prototypes</h1>
  <p class="body" style="margin-top:12px">Static prototypes for Curri industry landing pages, built for internal review. Not indexed, not public-facing.</p>
  <ul>
    <li>
      <a class="page-link" href="./pet-ecommerce/">
        Pet e-commerce
        <span>&rarr;</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
