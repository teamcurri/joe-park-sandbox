<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curri landing page prototypes</title>
<meta name="description" content="Prototype landing pages for Curri industry verticals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #1C1C1C;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    padding: 48px 24px;
  }
  img.logo {
    height: 22px;
    width: auto;
    display: block;
    margin-bottom: 40px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.6px;
  }
  p {
    margin: 0 0 32px;
    font-size: 16px;
    line-height: 25px;
    color: #626262;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 0.5px solid rgba(208, 211, 211, 0.6);
  }
  li {
    border-bottom: 0.5px solid rgba(208, 211, 211, 0.6);
  }
  a.page-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 4px;
    font-size: 16px;
    font-weight: 600;
    color: #1C1C1C;
    text-decoration: none;
  }
  a.page-link:hover {
    color: #00755A;
  }
  a.page-link span.arrow {
    color: #7A7A7A;
  }
</style>
</head>
<body>
<main>
  <img src="./assets/curri-logo-black.svg" alt="Curri" class="logo" />
  <h1>Landing page prototypes</h1>
  <p>Static prototypes for Curri industry landing pages, built for review.</p>
  <ul>
    <li>
      <a class="page-link" href="./pet-ecommerce/">
        Pet e-commerce
        <span class="arrow">&rarr;</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
